name: Build25

on:
  workflow_dispatch:
   
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Free up space
      uses: BRAINSia/free-disk-space@v2
      with:
        tool-cache: false
        mandb: true
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update > /dev/null
        sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
        sudo -E apt-get -qq autoremove --purge > /dev/null
        sudo -E apt-get -qq clean > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Update & Install feeds
      run: |
        chmod +x armsr/armv8/diy/diy.sh
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh

    - name: Load N1 custom config
      run: |
        rm -rf openwrt/files openwrt/.config
        mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/

    - name: Disable all Rust-related packages
      run: |
        cd openwrt
        
        # 1. 在 .config 中禁用所有已知 Rust 包
        cat >> .config << 'EOF'
        # Disable Rust and all Rust-dependent packages
        CONFIG_PACKAGE_rust=n
        CONFIG_PACKAGE_rust-bindgen=n
        CONFIG_PACKAGE_rust-src=n
        CONFIG_PACKAGE_librust=n
        CONFIG_PACKAGE_cargo=n
        CONFIG_PACKAGE_rustc=n
        CONFIG_PACKAGE_shadowsocks-rust=n
        CONFIG_PACKAGE_ripgrep=n
        CONFIG_PACKAGE_fd=n
        CONFIG_PACKAGE_exa=n
        CONFIG_PACKAGE_bat=n
        CONFIG_PACKAGE_alacritty=n
        CONFIG_PACKAGE_tokei=n
        CONFIG_PACKAGE_xsv=n
        EOF
        
        # 2. 从 feeds 中移除 Rust 和 shadowsocks-rust 目录（彻底阻止编译）
        if [ -d "feeds/packages/lang/rust" ]; then
          mv feeds/packages/lang/rust feeds/packages/lang/rust.disabled
          echo "Rust feed disabled"
        fi
        if [ -d "feeds/packages/net/shadowsocks-rust" ]; then
          mv feeds/packages/net/shadowsocks-rust feeds/packages/net/shadowsocks-rust.disabled
          echo "shadowsocks-rust feed disabled"
        fi
        
        # 3. 清理其他 Makefile 中对这些包的依赖（防止被拉入）
        find feeds -name "Makefile" -exec sed -i '/DEPENDS.*shadowsocks-rust/d' {} \;
        find feeds -name "Makefile" -exec sed -i '/PKG_BUILD_DEPENDS.*rust/d' {} \;
        find feeds -name "Makefile" -exec sed -i '/DEPENDS.*rust/d' {} \;
        
        echo "All Rust-related packages have been disabled."

    - name: Configure environment (disable Rust LLVM download fallback)
      run: |
        echo "LLVM_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
        echo "RUSTUP_INIT_SKIP_PATH_CHECK=yes" >> $GITHUB_ENV
        mkdir -p ~/.cargo
        cat > ~/.cargo/config.toml << 'EOF'
        [llvm]
        download-ci-llvm = false
        EOF

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec rm -f {} \;

    - name: Compile N1 firmware
      working-directory: ./openwrt
      env:
        LLVM_SKIP_DOWNLOAD: 1
        RUSTUP_INIT_SKIP_PATH_CHECK: yes
        RUST_BACKTRACE: 1
      run: |
        chmod -R 755 .
        echo -e "$(nproc) thread compile"
        make -j$(( $(nproc) + 1 )) V=s || make -j1 V=s

    - name: Check and fix build artifacts
      run: |
        cd openwrt
        echo "=== 查找编译产物 ==="
        find bin/targets -name "*.tar.gz" -type f
        find bin/targets -name "*.img" -type f
        echo "=== 检查 armsr/armv8 目录 ==="
        ls -la bin/targets/armsr/armv8/ || echo "目录不存在"
        if ls bin/targets/armsr/armv8/*-rootfs.tar.gz 1> /dev/null 2>&1; then
          ROOTFS_FILE=$(ls bin/targets/armsr/armv8/*-rootfs.tar.gz | head -1)
          echo "找到 rootfs: $ROOTFS_FILE"
          ln -sf "$(basename "$ROOTFS_FILE")" bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
        elif ls bin/targets/armsr/armv8/*.tar.gz 1> /dev/null 2>&1; then
          TAR_FILE=$(ls bin/targets/armsr/armv8/*.tar.gz | head -1)
          echo "找到 tar.gz: $TAR_FILE"
          ln -sf "$(basename "$TAR_FILE")" bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
        else
          echo "错误：未找到任何 rootfs 文件！"
          exit 1
        fi
        
    - name: Package N1 firmware
      uses: unifreq/openwrt_packit@master
      env:
        OPENWRT_ARMVIRT: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
        KERNEL_REPO_URL: tiantuuy/test
        SAVE_OPENWRT_ROOTFS: true
        KERNEL_VERSION_NAME: 6.18.y
        PACKAGE_SOC: s905d
        GZIP_IMGS: .gz
        WHOAMI: test
        SW_FLOWOFFLOAD: 0
        SFE_FLOW: 0
        ENABLE_WIFI_K510: 0
        OPENWRT_IP: 192.168.110.249

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: openwrt_N1_${{ env.FILE_DATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.{img.xz,img.gz,tar.gz}
        body: |
          首次使用建议全新刷写
          * 基本信息
          openwrt-25.12分支
          IP: 192.168.110.249
          账户: root
          密码: password

    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags: true
        
    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 0

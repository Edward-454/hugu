name: Build2512

on:
  workflow_dispatch:
   
env:
  GITHUB_TOKEN: ${{ secrets.N1RE }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Free up space
      uses: BRAINSia/free-disk-space@v2
      with:
        tool-cache: false
        mandb: true
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true

    - name: 初始化编译环境
      run: |
       curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh | sudo bash > /dev/null
       sudo timedatectl set-timezone "$TZ"
       sudo mkdir -p /workdir
       sudo chown $USER:$GROUPS /workdir
   
    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Update & Install feeds
      run: |
        chmod +x armsr/armv8/diy/diy.sh
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh

    - name: Load N1 custom config
      run: |
        rm -rf openwrt/files openwrt/.config
        mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec rm -f {} \;

    - name: Compile N1 firmware
      run: |
        chmod -R 755 openwrt
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(( $(nproc) + 1 )) || make -j1 V=s

    # 删除了原“Check and fix build artifacts”步骤，因为打包Action可直接使用通配符

    - name: Package N1 firmware
      uses: unifreq/openwrt_packit@master
      env:
        # 修正变量名并使用通配符，无需手动创建软链接
        OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/immortalwrt-armsr-armv8-generic-rootfs.tar.gz
        KERNEL_REPO_URL: tiantuuy/test
        SAVE_OPENWRT_ROOTFS: true
        # 建议根据实际可用内核调整，这里保留用户原设定 6.18.y
        KERNEL_VERSION_NAME: 6.18.y_6.1.y_6.12.y
        PACKAGE_SOC: s905d
        GZIP_IMGS: .gz
        WHOAMI: test
        SW_FLOWOFFLOAD: 0
        SFE_FLOW: 0
        ENABLE_WIFI_K510: 0
        OPENWRT_IP: 192.168.110.249/24

    - name: Upload firmware to release
      # 使用推荐的 upload-to-releases，简化上传和版本管理
      uses: ophub/upload-to-releases@main
      with:
        tag: openwrt_armsr-armv8_${{ env.FILE_DATE }}
        artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
        allow_updates: true
        replaces_artifacts: true
        make_latest: true
        gh_token: ${{ secrets.N1RE }}
        body: |
          首次使用建议全新刷写
          * 基本信息
          openwrt-25.12分支
          IP: 192.168.110.249
          账户: root
          密码: password

    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags: true

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 0
